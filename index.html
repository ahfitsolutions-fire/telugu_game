<!doctype html>
<html lang="te">
<head>

</head>
<body>

    <span class="star big" style="top:6%;left:10%"></span>
    <span class="star" style="top:12%;left:28%;animation-delay:.6s"></span>
    <span class="star" style="top:4%;left:46%;animation-delay:1.4s"></span>
    <span class="star big" style="top:18%;left:58%;animation-delay:2.1s"></span>
    <span class="star" style="top:9%;left:72%;animation-delay:.3s"></span>
    <span class="star" style="top:26%;left:88%;animation-delay:1.8s"></span>
    <span class="star" style="top:30%;left:6%;animation-delay:2.6s"></span>
    <span class="star big" style="top:36%;left:40%;animation-delay:1.1s"></span>
    <span class="star" style="top:42%;left:78%;animation-delay:.9s"></span>
    <span class="star" style="top:48%;left:18%;animation-delay:2.3s"></span>

    <span class="star" style="top:46%;left:52%;animation-delay:.2s"></span>

    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
    <span class="hill h1"></span>
    <span class="hill h2"></span>

    <span class="firefly" style="bottom:15%;left:58%;animation-delay:4s"></span>
    <span class="firefly" style="bottom:6%;left:76%;animation-delay:1s"></span>
    <span class="firefly" style="bottom:18%;left:90%;animation-delay:3s"></span>
  </div>
  <main id="app" class="app">లోడ్ అవుతోంది…</main>
  <script type="module" src="js/app.js?v=7"></script>

</html>
